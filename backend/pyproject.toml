[project]
name = "hackathon-api-base"
version = "0.0.0"
description = "Generic Python API and EVM development environment"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi", "uvicorn[standard]", "web3", "eth-account", "httpx",
  "pydantic-settings", "python-dotenv", "sqlalchemy", "psycopg[binary]", "redis",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
