[profile.default]
src = "contracts"
test = "contracts"
out = "out"
cache_path = "cache/forge"
libs = ["../node_modules", "node_modules"]
solc_version = "0.8.34"
optimizer = true
optimizer_runs = 200
remappings = ["forge-std/=../node_modules/forge-std/src/", "@openzeppelin/=../node_modules/@openzeppelin/"]
